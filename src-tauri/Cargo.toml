[package]
name = "app"
version = "0.1.21"
description = "RushVoice - voice input for Windows and macOS"
authors = ["Olive Co., Ltd."]
license = "Apache-2.0"
repository = "https://github.com/rushvoice/rushvoice"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# Tauri core
# tray-icon: Phase 1 Day 9 TRAY-01 タスクトレイ常駐 (Tauri 2.x optional feature)
# image-png: TRAY-01 P1-3 default_window_icon フォールバック用 (Image::from_bytes)
# macos-private-api: Phase 5 Step C-1 — overlay window .transparent(true) を macOS で有効化 (Day 27 2026-05-28)
tauri = { version = "2.11.2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"

# Phase 1 Day 6 Stage 2-C: グローバルホットキー (Ctrl+Shift+NonConvert デフォルト)
tauri-plugin-global-shortcut = "2.3"

# Phase 1 Day 9 AUT-01: Windows スタートアップ自動登録
# (HKCU\Software\Microsoft\Windows\CurrentVersion\Run\RushVoice に登録される。
#  キー名は tauri.conf.json::productName "RushVoice" 由来・実機検証済 2026-05-23。
#  2026-07-07 productName を "rushvoice-hello" → "RushVoice" にリネーム・登録キー名も追随)
tauri-plugin-autostart = "2"

# Phase 1 Day 12 Step 1-A: 多重起動防止 (Single Instance Lock)
# 2 度目起動時は即終了し、既存のメインウィンドウを show + focus する。
# release exe (Autostart) + dev mode 並行起動による overlay 2 重表示 / 履歴反映不可を根本防止。
# deep-link 機能は未使用 (features 無指定で最小構成)。
tauri-plugin-single-instance = "2"

# v0.1.10 機能 E: ファイル保存/開く Dialog (DictionaryPage 辞書 CSV インポート/エクスポート)
# frontend で @tauri-apps/plugin-dialog を invoke するために Rust 側 plugin 登録が必要。
tauri-plugin-dialog = "2"

# mac/url-scheme-trigger (2026-06-16): URL Scheme `rushvoice://toggle` でホットキー相当の
# 録音 ON/OFF を発火させる。Logi Options+ や Shortcuts.app などの外部ツールから
# キー入力イベントを介さずに RushVoice を制御できるようにするのが目的。
# macOS の Logi Options+ ボタン → CGEventTap 経路がHID kext で詰まる問題への代替ルート。
tauri-plugin-deep-link = "2"

# Serialization
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# Logging: log クレートのみ (tauri-plugin-log が受け皿)。
# tracing は直接依存から削除 — subscriber 未初期化のため tracing マクロの出力は
# 全て破棄されていた (audio.rs / clipboard / transcribe / hedged / migration / resampler が該当。
# 録音中にマイクが死んだ時の唯一の証跡も無記録だった)。再導入しないこと。教訓 L286。
log = "0.4"

# Async runtime + cancellation
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP/2 keep-alive client (Sprint Plan §2.2 Day 5)
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json", "multipart", "gzip", "deflate"] }

# Audio capture (Sprint Plan §2.2 Day 3-4)
cpal = "0.15"

# Audio resampling (Sprint Plan §2.2 Day 4-A - 48kHz device → 16kHz mono)
rubato = "0.16"

# Windows API (DPAPI + SendInput + Clipboard - L058 fix
#  + Stage 2-C-2 WH_KEYBOARD_LL 低レベルキーボードフック・無変換キー対応)
windows = { version = "0.58", features = [
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_Foundation",
] }

# SQLite (Sprint Plan §3.2 Day 11 履歴 / §5.3 編集学習)
rusqlite = { version = "0.32", features = ["bundled"] }

# Error handling (Sprint Plan §2.2 Day 3-4 - 統合エラー型)
anyhow = "1.0"
thiserror = "1.0"

# Base64 (Day 5 後半 DPAPI 暗号化結果のエンコード - v1 互換 JSON スキーマ)
base64 = "0.22"

# Timestamps (Day 5 後半 DPAPI - config.secrets.encrypted.json encryptedAt フィールド)
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# v0.1.3 patch3: 後処理 glossary 置換 (C-add) で is_regex=true エントリの正規表現適用に使用
regex = "1"

# v0.1.10 機能 E: 辞書 CSV インポート/エクスポート
# - UTF-8 BOM 付き + CRLF + RFC 4180 準拠クォート
# - export_to_writer / parse_csv は src/glossary_csv.rs で薄くラップ
csv = "1.3"

# Day 40 議事録履歴リンク機能: meeting_get_export_md_path / meeting_get_export_dir の結果を
# OS 既定アプリで開く (md → エディタ、フォルダ → explorer/Finder)。Tauri 公式 plugin。
tauri-plugin-opener = "2"

# Day 39 Mac 致命バグ修正: APPDATA 環境変数依存 (Windows 専用) を全廃し、OS 抽象化された
# data_dir を全 default_*_path() の基底にする。dirs::data_dir() は以下を返す:
#   Windows: %APPDATA% (FOLDERID_RoamingAppData)
#   macOS:   ~/Library/Application Support
#   Linux:   $XDG_DATA_HOME or ~/.local/share
# Windows 既存ユーザーのパスは不変 (互換性 OK)。詳細: src/paths.rs。
dirs = "5"

# v0.1.10 機能 E: 保存/開くダイアログ (Rust 側 #[tauri::command] から dialog plugin 経由は使わず、
# frontend で @tauri-apps/plugin-dialog を直接利用するため、Rust 側依存は不要)。
# Rust 側 command はパス文字列を受け取り std::fs::File で読み書きする。

# ---------------------------------------------------------------------------
# macOS target dependencies (Phase 5 Step C-1 / C-2 / C-3)
# ---------------------------------------------------------------------------
# C-1 clipboard/macos_impl.rs: NSPasteboard (objc2-app-kit) + CGEvent (core-graphics)
# C-2 keyboard_hook/macos_impl.rs: CGEventTap (core-graphics) + CFRunLoop (core-foundation)
# C-3 crypto/macos_impl.rs: Keychain Services (security-framework passwords モジュール)
# Windows ビルドには cfg(target_os = "macos") により含まれない。
#
# バージョン選定方針:
#   Cargo.lock に tauri 経由で既に入っている transitive バージョンに合わせて
#   依存グラフを重複させない (objc2 0.6.4 / objc2-app-kit 0.3.2 / objc2-foundation 0.3.2 /
#   core-graphics 0.25.0 / core-foundation 0.10.1 / security-framework 3.7.0 が既存)。
#   caret requirement (^) で minor が一致する範囲を許可。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# objc2-app-kit 0.3.x は per-class feature gating。NSPasteboard を有効化。
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
# objc2-foundation 0.3.x も per-class feature。NSString を有効化。
objc2-foundation = { version = "0.3", features = ["NSString"] }
core-graphics = "0.25"
# C-2 CFRunLoop / CFRunLoopRun / CFRunLoopStop。core-graphics 0.25 が
# transitive で core-foundation 0.10 を持ち込むため、明示依存も 0.10 に揃える。
core-foundation = "0.10"
# C-4 mic_permission.rs: AVCaptureDevice.requestAccessForMediaType_completionHandler
# (macOS TCC マイク許可ダイアログ発火) に block2 が必要。
# 0.6.x は tauri-runtime-wry 経由で transitive 採用済 (Cargo.lock 確認: block2 = 0.6.2)。
block2 = "0.6"
# objc2-av-foundation: AVCaptureDevice + AVMediaTypeAudio を型付きで使う。
# 自作 msg_send! ではブロック呼び出しが即 denied で返る挙動を観測したため、正規バインディング経由に切替。
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
# C-3 Keychain Services: set/get/delete_generic_password helper + errSecItemNotFound 判定。
# 3.7.0 が tauri 経由で transitive 採用済。caret "3" で同 minor に固定。
# default features (OSX_10_14 + alpn + session-tickets) は TLS 用なので default-features = false で
# 最小化したいが、現状デフォルト機能でも余分なリンクは入らない実測 (clippy 警告ゼロ確認済) のため据置。
security-framework = "3"
# C-3 fix: errSecItemNotFound 定数を crypto/macos_impl.rs で参照するため direct dep が必要
# (security-framework crate は内部で security-framework-sys を使うが、定数は re-export していないため
#  Rust の crate visibility ルールにより明示的に direct dependency として宣言が必要)
security-framework-sys = "2"

# ---------------------------------------------------------------------------
# Clippy lints (v0.1.9 Day 28 追加・rust-clippy 1.95 で新規 deny 化された既存コード問題への暫定対応)
# ---------------------------------------------------------------------------
# 以下 4 件は v0.1.9 patch スコープ外 (既存コード由来・rust-clippy 1.95 で新規 deny 化)。
# 別 PR で恒久対応する。
#   - unnecessary_mut_passed: windows crate 0.58 CryptProtectData/CryptUnprotectData は
#     &mut で呼んでも実害なし (windows-rs バインディング側仕様)。
#   - needless_pass_by_ref_mut: 同上。
#   - doc_lazy_continuation: halu.rs L46 ドキュメント改行スタイル。
#   - manual_clamp: encode_wav_pcm16 既存実装 (f32 sample clipping)。
[lints.clippy]
unnecessary_mut_passed = "allow"
needless_pass_by_ref_mut = "allow"
doc_lazy_continuation = "allow"
manual_clamp = "allow"
# v0.1.10 (Day 30): rust-clippy 1.95 で新規 deny 化された既存コード問題 (機能 E スコープ外)
# - ptr_arg: app_rules_db.rs:515 test fn 引数 &PathBuf → &Path 推奨 (test scope のため影響軽微)
# - useless_conversion: audio.rs:203 batch.into_iter() (既存 cpal 配線・動作影響なし)
# - let_unit_value: glossary_db.rs:484 既存 test (Step 2.5 追加時に書かれた let _ パターン)
ptr_arg = "allow"
useless_conversion = "allow"
let_unit_value = "allow"
